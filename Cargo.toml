[package]
name = "repomap"
version = "0.1.0"
edition = "2021"
# libsqlite3-sys 0.38 (via rusqlite 0.40) uses cfg_select!, stabilized in 1.95.
# Bump deliberately, with the CI msrv job, not as a dependency side effect.
rust-version = "1.95"

[[bin]]
name = "repomap"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
rayon = "1"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
directories = "6"
indicatif = "0.17"
tree-sitter-ruby = "0.23.1"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"
