[package]
name = "repomap"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "repomap"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
directories = "6"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
